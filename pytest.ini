[pytest]
DJANGO_SETTINGS_MODULE = refugis_lliures.settings
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --strict-markers
    --tb=short
    --disable-warnings
markers =
    unit: Unit tests
    integration: Integration tests
    views: View/endpoint tests
    serializers: Serializer tests
    controller: Controller tests
    controllers: Controller tests
    daos: DAO tests
    mappers: Mapper tests
    models: Model tests
    edge_cases: Edge case tests
    slow: Slow tests
    db_infra: Requereix el Postgres local (TEST_DATABASE_URL_APP/MIGRATOR; scripts/dev/setup_local_postgres.sh); salta si no hi són
    rls: Tests de la RLS i del context per transaccio (rol app)
    legacy_firestore_users: Tests antics d usuaris sobre Firestore, substituits al chunk 3 per apps/accounts/tests (l implementador els esborra; vegeu docs/migration)
    real_audit_log: Disables the automatic AuditLogService.log mock
    real_permissions: Disables the automatic get_user_for_permissions mock
testpaths = api/tests apps
