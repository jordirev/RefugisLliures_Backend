name: Django CI

on:
  push:
    branches: [ "main", "develop", "migration" ]
  pull_request:
    branches: [ "main", "develop", "migration" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      max-parallel: 4
      matrix:
        python-version: ["3.10"]

    # PostgreSQL + PostGIS efímer per als tests (mateixa versió major que Neon).
    services:
      postgres:
        image: postgis/postgis:17-3.5
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v3
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install system dependencies (GDAL for GeoDjango, psql client)
      run: |
        sudo apt-get update
        sudo apt-get install -y gdal-bin libgdal-dev postgresql-client

    - name: Install tox
      run: |
        python -m pip install --upgrade pip
        pip install tox

    - name: Bootstrap test database (roles, extensions, grants)
      env:
        PGHOST: localhost
        PGPASSWORD: postgres
        PG_START_CLUSTER: "0"
      run: |
        # Primer a un fitxer: si el bootstrap falla, el pas falla (dins d'`eval "$(...)"` l'error s'ignoraria
        # i els tests caurien a SQLite sense avisar).
        scripts/dev/setup_local_postgres.sh > "$RUNNER_TEMP/pg.env"
        eval "$(grep '^export ' "$RUNNER_TEMP/pg.env")"
        test -n "$TEST_DATABASE_URL_APP" && test -n "$TEST_DATABASE_URL_MIGRATOR"
        echo "TEST_DATABASE_URL_APP=$TEST_DATABASE_URL_APP" >> "$GITHUB_ENV"
        echo "TEST_DATABASE_URL_MIGRATOR=$TEST_DATABASE_URL_MIGRATOR" >> "$GITHUB_ENV"

    - name: Run tox (run tests & coverage report)
      run: tox -e py

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
        files: coverage.xml

    - name: SonarQube Scan
      uses: SonarSource/sonarqube-scan-action@v6
      env:
        SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
